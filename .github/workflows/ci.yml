name: Portfolio CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  quality-check:
    name: Code Quality & Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Application
        run: npm run build

      - name: Run Security Audit
        # This will fail the pipeline if there are high/critical vulnerabilities in production dependencies
        # We omit dev dependencies because build-tool vulnerabilities don't affect the deployed static site.
        run: npm audit --audit-level=high --omit=dev

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-build
          path: dist/
